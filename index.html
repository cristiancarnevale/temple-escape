<html lang="en">
<head>

<title>Temple Escape</title>
<style>
:root{--bg:#08191f;--panel:#0f2c36;--panel-2:#153947;--line:#2a5866;--fg:#e8efe9;--muted:#8db0b4;--accent:#f2b84b;--accent-ink:#2a1c03;--good:#6fcf8c;--bad:#ef6f62;
  --font-body:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
/* The whole game fits the screen: header, then a stage that takes the rest of the height. */
.app{max-width:1080px;margin:0 auto;height:calc(100vh - 20px);height:calc(100dvh - 20px);display:flex;flex-direction:column;gap:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{margin:0;font-size:26px;line-height:1}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.viewport{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;background:#0b3d50;overflow:hidden}

button:hover:not(:disabled){border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(4,12,16,.88);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto}

.card h2{margin:0;font-size:30px;line-height:1.05}.card p{margin:0}
.kicker{font:500 11px ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.langs{display:flex;gap:6px;flex-wrap:wrap}.langs button{min-height:32px;padding:4px 12px;font-size:13px}.langs button.on{border-color:var(--accent);color:var(--accent)}
.muted{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:26px;align-items:center}.chip{background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:3px 8px;font-size:12.5px;color:var(--accent)}
.hbtns{display:flex;gap:6px}
.card.wide{max-width:640px}
.shophead{display:flex;gap:16px;align-items:center}.shophead p+p{margin-top:4px}
#prev{width:120px;height:120px;flex:none;background:var(--panel-2);border:1px solid var(--line);border-radius:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{min-height:36px;padding:6px 14px}.tabs button.on{border-color:var(--accent);color:var(--accent)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.items button{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;text-align:left}.items button.on{border-color:var(--good)}.items small{color:var(--muted);font-weight:500;font-size:12px}.items button.on small{color:var(--good)}
.dot{width:16px;height:16px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,.35)}
.coming{font:700 22px var(--font-body);color:var(--accent);text-align:center;padding:10px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.earn{font-size:17px}.earn b{color:var(--accent);font:600 20px ui-monospace,Menlo,monospace}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stats div{background:var(--panel-2);border-radius:4px;padding:8px 10px;font-size:12px;color:var(--muted)}.stats b{display:block;font:500 18px ui-monospace,Menlo,monospace;color:var(--fg)}
.card.wide{max-width:640px}.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px}.vrow{display:flex;align-items:center;gap:8px;margin:2px 0;flex-wrap:wrap}.vrow>span:first-child{flex:1 1 120px;font-weight:600;font-size:13px}.vrow .muted{font-size:12px}.vrow button{min-width:56px;min-height:44px;font-size:22px}
.whoin{width:100%;font:600 18px var(--font-body);padding:10px 12px;color:var(--fg);background:var(--panel-2);border:1px solid var(--line);border-radius:4px;-webkit-user-select:text;user-select:text}.whoin:focus{outline:2px solid var(--accent);border-color:var(--accent)}#whobtn{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>

"Il pavimento è di ghiaccio puro. Scivoli finché qualcosa non ti ferma.","La Porta dei Numeri","Scolpito nella pietra: \"Il codice: ","La Sala della Canzone","Il Trono del Sole","Scolpito nella pietra: \"Gira ogni statua verso nord. Attenzione: ogni statua trascina con sé la sua vicina.\"","Scolpito nella pietra: \"Gira ogni statua verso est. Attenzione: ogni statua trascina con sé la sua vicina.\"","Scolpito nella pietra: \"Gira ogni statua verso sud. Attenzione: ogni statua trascina con sé la sua vicina.\"","Scolpito nella pietra: \"Gira ogni statua verso ovest. Attenzione: ogni statua trascina con sé la sua vicina.\"","Scolpito nella pietra: \"Il numero si nasconde dietro il libro subito a destra del libro rosso.\"","Scolpito nella pietra: \"Il numero si nasconde dietro il libro subito a destra del libro blu.\"","Scolpito nella pietra: \"Il numero si nasconde dietro il libro subito a destra del libro verde.\"","Scolpito nella pietra: \"Il numero si nasconde dietro il libro subito a destra del libro viola.\"","Scolpito nella pietra: \"Il numero si nasconde dietro il libro subito a destra del libro giallo.\"","Scolpito nella pietra: \"Il numero si nasconde dietro il libro subito a destra del libro arancione.\"","Scolpito nella pietra: \"Il numero si nasconde dietro il libro subito a destra del libro bianco.\"","Rombo! Dei massi rotolano per questa sala. Guarda le frecce sui muri.","Delle piastrelle con punte spuntano e rientrano in questa sala. Calcola bene i passi.","Attenzione! Ci sono buche nel pavimento.","Scolpito nella pietra: \"Accendi ogni lanterna prima che la prima si spenga.\"","Scolpito nella pietra: \"Suona le campane in quest'ordine, contando da sinistra: ","Scolpito nella pietra: \"La gemma dorme tra la "," pila e la "," pila.\"","Scolpito nella pietra: \"Imposta il quadrante sul numero di stelle dorate sul muro.\"","Scolpito nella pietra: \"Calpesta le piastre colorate nell'ordine mostrato sul muro.\"","La Cella Sonnolenta","Scolpito nella pietra: \"Bentornato, esploratore. L'enorme caveau è la via d'uscita.\"","La Sala del Caveau","Scolpito nella pietra: \"Dieci sale circondano il caveau. Ognuna custodisce un numero segreto. Portali tutti al caveau.\"","La Sala delle Lanterne","La Sala dell'Eco","Il Giardino delle Statue","La Sala della Notte","La Sala della Sabbia","La Sala dei Numeri","La Sala dei Colori","La Sala Buia","Qui è buio pesto. Qualcosa brilla piano, da qualche parte.","La Sala dello Scivolo","La Biblioteca Nascosta","Grandi onde risalgono la spiaggia. Guarda le frecce di schiuma ai bordi.","In questa stanza i ricci di mare spuntano e rientrano. Scegli bene il momento.","Attenzione! Nella sabbia ci sono pozze profonde.","Attenzione! Nella sabbia si nascondono le sabbie mobili.","Un tunnel segreto! Fai attenzione dove metti i piedi al buio.","Il tesoro dei pirati! L'oro brilla dappertutto.","Il sentiero si torce come un serpente. Trova la strada verso nord al buio.","Il fiume è profondo. Salta sulle pietre per attraversarlo. Alcune pietre affondano per un momento, quindi guardale bene.","Attenzione! In questa palude ci sono buche di fango.","Rumble! In questa stanza rotolano dei tronchi. Guarda le frecce ai bordi.","Tanica di benzina","Hai trovato una tanica di benzina per l'aereo!","Hai trovato un'elica! È un po' infangata, ma gira.","Chiave del pilota","Hai trovato la chiave del pilota!","Hai trovato un paio di remi!","Hai trovato una grande vela bianca!","Hai trovato una bussola di ottone!","Hai trovato un timone per la barca!","Scritto su un palo coperto di muschio: \"A ovest c'è il fiume. A est c'è la palude. A sud c'è il vecchio albero. A nord si nasconde qualcosa.\"","Un cartello arrugginito dice: \"Pista di atterraggio. Questo aereo ha bisogno di tre cose: benzina, un'elica e una chiave.\"","La radura della giungla","La riva del fiume","La palude delle rane","Il vecchio albero","La vecchia pista","Il sentiero intricato","La grotta della cascata","Le rovine delle scimmie","Il giardino sommerso","Un cartello rotto dice: \"A ovest c'è la barriera. A est c'è la baia dei pirati. A sud c'è il faro. A nord c'è ciò che i vecchi pescatori hanno nascosto.\"","Un cartello sbiadito dice: \"Vecchio molo. Per una barca servono remi e una vela.\"","La spiaggia dello schianto","La barriera corallina","La baia dei pirati","Il faro","Il labirinto di mangrovie","Il vecchio molo","La Secca","Il Relitto","Il Tunnel Segreto","Il Tesoro dei Pirati","Diario dell'esploratore","Fuga dal Tempio","Stavi inseguendo una farfalla dorata quando il terreno della giungla ha ceduto. Precipiti attraverso il tetto di un antico tempio di pietra e atterri sul pavimento polveroso della Sala d'Ingresso.","Il buco sopra è troppo alto per arrampicarsi. L'unica via d'uscita attraversa il tempio, tra indovinelli, leve e pavimenti insidiosi, e sale le scale verso il sole.","Muoviti con le frecce, WASD, i pulsanti o toccando la mappa. Cammina contro le cose per usarle. Qui niente può farti male. Se scivoli, perdi solo un po' di tempo.","Esploratore: <b id=\"pn\"> <\/b>","Inizia l'esplorazione","Vai direttamente alla seconda parte","Vai subito alla Parte Tre","Vai subito alla Parte Quattro","Negozio","Non sei tu?","Chi sei?","Scrivi il tuo nome. I tuoi punti e i tuoi vestiti vengono salvati con il tuo nome.","Oppure scegli un esploratore:","Sono io","Annulla","Il guardiano parla","La statua parla","Vai via","Poi, TWIP! Qualcosa di piccolo ti punge il collo. Un dardo tranquillante! Le gambe ti tremano, la luce del sole si sfoca e tutto diventa morbido e sonnolento. Non preoccuparti, è solo un dardo sonnifero.","Inizia la seconda parte","Mentre dormi, un enorme caveau ti aspetta in un'altra parte del tempio, chiuso con dieci codici segreti.","Hai guadagnato <b>","<\/b> punti!","Passi<b>","Svegliati nella seconda parte","Gioca ancora","Vai al negozio","Leggenda del tempio","Campione del Sole","Esploratore del cielo","Sei scappato!","Sali i gradini consumati con l'idolo d'oro in un braccio e la Corona del Sole in testa. La luce del sole ti inonda, l'intero tempio emette un lungo, felice rombo e la farfalla dorata ti guida verso casa.","Ti metti in testa la Corona del Sole e sali le ultime scale verso l'aria aperta. L'intera giungla splende sotto di te, e la farfalla dorata danza attorno alla corona.","Lasci la Corona del Sole sul suo trono e sali le ultime scale verso l'aria aperta. La giungla splende sotto di te, e la farfalla dorata si posa sulla tua spalla.","Cacciatore di tesori","Esploratore saggio","Sali i gradini consumati con l'idolo d'oro sotto il braccio e spingi un portello di pietra. La luce del sole ti inonda. Gli uccelli cantano. Molto più in basso, il tempio emette un lungo rombo sollevato e tace.","Lasci l'idolo d'oro sul suo piedistallo, perché certi tesori appartengono al loro posto. Le scale finiscono in un portello di pietra. Lo spingi e la luce del sole ti inonda. Gli uccelli cantano, e la farfalla dorata ti aspetta.","Segreto: questo tempio ha più cose di quelle che hai visto. Riesci a trovare il piano di sotto?","Vesti il tuo esploratore","I tuoi punti: <b>","Batti il gioco per guadagnare altri punti."," pt","Fatto","Il sostegno della torcia ora è vuoto.","Estrai una torcia dal sostegno sul muro. Si accende con una calda luce arancione.","Una giara di terracotta incrinata. Dentro c'è un biglietto arrotolato: \"Accendi una torcia prima di andare più a fondo. Le sale buie nascondono la via.\"","La statua sorride. I suoi occhi brillano di verde.","Un mosaico sbiadito mostra quattro segni in fila. Sotto c'è scritto: \"Risvegliali in quest'ordine.\"","Questa giara ora è vuota.","La pietra della farfalla è già premuta.","Sulla pietra è scolpita una farfalla dorata. La premi. Clic! Una scala nascosta si apre verso l'alto, nella luce delle stelle.","Clic! I tre quadranti si bloccano al loro posto e la porta a nord si apre.","La sfera ora è silenziosa.","La sfera si illumina e suona una canzone di luci. Guarda bene, poi riproducila sulle piastre.","Il trono ora è vuoto.","Sollevi la Corona del Sole. È calda e brilla piano. Le scale verso l'aria aperta ti aspettano.","Cinque lampade sono dipinte sul muro. Premere una pietra la inverte insieme alle due vicine. Rifai il disegno.","Hai già scavato qui.","Sotto la sabbia trovi una pietra luminosa!","La sabbia cede! Scivoli indietro fino alla porta.","Si apre un pannello segreto nel muro del faro. Dentro c'è una bussola di ottone!","La piastra vibra piano.","Bzzt! Non è questa. Nessun problema, ricomincia dal primo colore.","Solo polvere e vecchie pagine.","Dietro il libro c'è una pietra luminosa!","Sulla corteccia sono dipinti cinque funghi. Toccando un fungo, cambia lui e i suoi due vicini. Copia il disegno.","La chiave del pilota vibra e brilla. Le liane si aprono e un sentiero porta a nord!","Fitte liane bloccano la strada a nord. Non si muovono.","Sali a bordo e giri la chiave. Il motore tossisce e poi ruggisce!","Il serbatoio è vuoto. Cerca una tanica di benzina.","Il muso non ha l'elica. Forse qualcuno l'ha persa nella palude.","Nella cabina serve una chiave. Un albero cavo potrebbe tenerne una al sicuro.","Una porta nascosta scivola via nel muro. Dentro c'è un'elica!","Un portello segreto si apre. Dentro c'è una grande vela bianca!","La pietra del teschio è già premuta.","Su questa roccia è scolpito un teschio. Lo premi. Clic! Si apre una scala segreta nel pavimento.","Il vecchio aereo è un relitto fumante. Non volerà mai più. Ti serve una barca!","La bussola gira e punta a nord. Le grosse radici si aprono!","Un groviglio di radici di mangrovia blocca la strada a nord. Non si muovono.","Ora il baule è vuoto.","Apri l'enorme baule del tesoro. È pieno di monete d'oro! Hai guadagnato 50 punti bonus.","Apri il vecchio baule. Dentro c'è un mango d'oro luccicante! Hai guadagnato 20 punti bonus.","Spingi la barca fuori dal molo. La vela si gonfia di vento!","La barca non ha remi. Cerca vicino alla barriera.","L'albero non ha la vela. Forse i pirati ne hanno nascosta una.","La barca non ha il timone. Forse è nel vecchio relitto.","La lanterna è già accesa.","Ti serve una fiamma per accenderla.","L'ultima lanterna si accende con un guizzo.","La lanterna brilla calda.","La campana suona piano.","L'ultima campana risuona.","Clang! Le campane tacciono. Nessun problema, ricomincia.","Un mucchio di pietre cadute blocca il passaggio.","Un pesante pilastro di pietra.","Un muro di pietra scolpita. Solo il guardiano può aprirlo.","La piastra è già premuta. La porta è aperta.","Premi il pulsante di pietra. Il pesante masso scivola indietro dov'era all'inizio.","Il piedistallo è vuoto.","Sollevi l'idolo d'oro. L'intero tempio trema e il pavimento comincia a creparsi!","Il cristallo brilla con luce ferma.","Il quarto cristallo si illumina. La porta di pietra scivola aperta con un profondo ronzio.","Ping! Il cristallo si illumina.","Bzzt! Tutti i cristalli si spengono. Riprova, la targa ha l'indizio.","Le piastre vibrano piano. La porta è aperta.","Tocca prima la sfera luminosa.","Prima guarda, poi riproducila.","Din-din-din! La canzone è completa e la porta a nord scivola aperta.","Nota sbagliata. La sfera suonerà di nuovo la canzone.","La pietra non si sposta in quella direzione.","Clic! La piastra di pietra affonda e la porta a nord si apre con un cigolio.","La leva è già abbassata.","La quarta leva scatta giù. Da qualche parte nel muro una catena sferraglia e la porta a nord si apre con un cigolio.","Clunk. La leva "," resta abbassata.","Clic-clic-clic. Tutte le leve tornano su di scatto. Riprova, il mosaico ha l'ordine.","Oltre la porta è buio pesto. Prima ti serve una luce.","La porta è sigillata. Quattro statue la sorvegliano. Rispondi a tutti i loro indovinelli.","La porta di pietra non si muove. Deve esserci un modo per svegliarla.","La porta è chiusa a chiave. Ti serve una chiave.","La porta ha tre quadranti numerici. È chiusa ermeticamente.","La porta è chiusa. Le piastre luminose devono suonare la canzone giusta.","La porta è serrata. Qualcosa di pesante deve stare sulla piastra di pietra.","Ti svegli sulla pietra fredda in un'altra parte del tempio. La testa è un po' confusa, ma stai bene.","Sul muro compare un numero luminoso!","Il ghiaccio si scioglie in semplice pietra.","L'enorme caveau","Imposta ogni quadrante sul numero della sua sala. Se hai già visto un numero, è scritto qui per te.","Hai visto il numero ","Seconda parte","Il caveau si apre!","Ogni quadrante scatta al suo posto. CLUNK! L'enorme porta del caveau si spalanca e la luce del sole entra a fiotti. Sei scappato dalla seconda parte!","Nella giungla: Parte Tre","Gioca di nuovo la seconda parte","Esci dal caveau in una giungla calda e fitta. Da qualche parte c'è un aereo che può portarti a casa.","Un aereo ha bisogno di benzina, un'elica e una chiave. Guardati intorno!","Clic! Dentro l'albero si apre una cavità e dentro luccica una chiave!","Parte tre","L'aereo decolla!","Il motore ruggisce e il vecchio aereo sale alto sopra la giungla verde. Poi tossisce e singhiozza. Fumo! Plani giù e atterri di botto su una spiaggia sabbiosa. Non ti sei fatto male, ma l'aereo non vola più.","Continua con la Parte Quattro","Gioca di nuovo la Parte Tre","CRASH! Rotoli fuori dall'aereo rotto su una spiaggia sabbiosa. Non ti sei fatto male, ma l'aereo non volerà mai più.","Forse puoi trovare una barca per scappare da quest'isola. Guardati intorno!","Parte quattro","Parti navigando!","Spingi la barca nel mare azzurro. Il vento gonfia la vela e l'isola diventa sempre più piccola. Ma cos'è quella nuvola scura all'orizzonte? Continua...","Gioca di nuovo la Parte Quattro","Splash! Cadi nel fiume e torni a nuoto sulla riva. Nessun danno.","Ohi! La sabbia ti risucchia i piedi. Ti liberi e risali alla porta. Nessun problema.","Splash! Cadi in una pozza profonda e esci vicino alla porta. Nessun danno.","Splop! Affondi nel fango e esci vicino alla porta. Nessun danno.","Scivoli in una buca e risali alla porta. Nessun danno.","Splash! La pietra è affondata. Torni a nuoto sulla riva. Nessun danno.","Scendi la scala segreta in un tunnel buio.","Sali la scala segreta. L'aria fresca della notte e la luce delle stelle ti accolgono.","Clic! La piastrella affonda e scivoli all'inizio della sala.","Ruzzoli giù in una cantina sotto il tempio. Le macerie sono morbide, quindi non ti fai male. La torcia brucia ancora.","Whoosh! Che caldo! Salti indietro all'inizio della sala.","Bonk! Un barile ti rimanda alla porta. Nessun problema.","Splash! Una grossa onda ti spinge indietro verso la porta. Nessun danno.","Whump! Un tronco ti spinge indietro verso la porta. Nessun danno.","Whump! Un masso ti spinge indietro fino alla porta. Nessun danno.","Ahi! Un riccio di mare ti punge. Torni indietro verso la porta.","Ahi! Le punte ti pungono. Salti indietro fino alla porta.","Le lanterne si spengono. Nessun problema, riaccendile, ma più in fretta!","Torcia","Chiave di bronzo","Idolo d'oro","Corona del Sole","Codici "," su 10","Indovinelli "," su 4"," su 2","A mani vuote.","Ti scrolli la polvere di dosso. Trova una luce, poi trova la via d'uscita.","Acquistato! Stai benissimo.","Non hai ancora abbastanza punti. Batti il gioco per guadagnarne altri!","Esatto! Gli occhi della statua brillano di verde.","Un profondo clic risuona dalla porta a nord. È aperta.","Corretto! Il guardiano annuisce. \"Ancora una domanda.\"","Corretto! Il guardiano si inchina e il muro di pietra affonda nel pavimento. La via verso le scale è aperta.","Gli occhi della statua tremolano. Non è questa. Riprova, non c'è fretta.","Il guardiano aspetta con pazienza. Riprova, non c'è fretta.","Niente","Zaino","Cappelli","Giacche","Schiena","Passi","Monete","Acqua","Tempo","Pioggia","Il buio","La luce del sole","Elica","Remi","Vela","Bussola","Timone","Indossato","Indossa","Sole","Luna","Stella","Onda","Suono","Lingua","Mappa del gioco","Vai a nord","Vai a ovest","Vai a sud","Vai a est","Indovinello","Pelle","prima","seconda","terza","quarta","quinta","sesta","Din!","Scivoloni<b>"],"es":["Sombrero de explorador","Gorra roja","Gorro de fiesta","Sombrero de mago","Sombrero pirata","Sombrero de copa","Corona de oro","Sin sombrero","Chaqueta naranja","Chaqueta azul","Chaqueta verde","Chaqueta roja","Chaqueta morada","Chaqueta de rayas","Chaqueta dorada","Capa roja","Alas de mariposa","Cuantos más me llevas, más dejas atrás. ¿Qué soy?","Soy alta cuando soy joven y baja cuando soy vieja. ¿Qué soy?","Una vela","Un árbol","Una montaña","Un río","Repito cada palabra que dices, pero no tengo boca. ¿Qué soy?","Un loro","Un espejo","Un eco","Una sombra","¿Qué se moja más cuanto más seca?","Una toalla","Un pez","Un lago","Cuanto más hay de mí, menos ves. ¿Qué soy?","Un arcoíris","Tengo manos pero no puedo aplaudir. ¿Qué soy?","Una estatua","Un reloj","Un bote","¿Qué sube cuando la lluvia baja?","Un pájaro","Una nube","Un paraguas","Una cometa","Tengo ciudades pero no casas, montañas pero no árboles y agua pero no peces. ¿Qué soy?","Un sueño","Un libro","Un mapa","¿Qué hay que romper antes de poder usarlo?","Una llave","Un puente","Un huevo","Una canción","¿Qué puede viajar por todo el mundo quedándose en una esquina?","Un sello","Un avión","Un barco","¿Qué tiene muchas teclas pero no puede abrir ni una sola puerta?","Un piano","Un castillo","Un anillo","Un candado","Vacía, salvo por una araña muy sorprendida.","Solo polvo y unas cuantas piedrecitas viejas.","¡Una sola moneda de oro! Qué pena que sea de chocolate y viejísima.","Dentro hay una ranita. Salta fuera y se aleja. ¡Croac!","Solo un pedazo de cuerda vieja.","¡Bajo una capa de arena encuentras una pequeña llave de bronce!","las narices en tu cara","las ruedas de una bicicleta","los lados de un triángulo","las patas de un perro","los dedos de una mano","las patas de un insecto","los días de una semana","las patas de una araña","las vidas de un gato","Grabado en la piedra: \"Despierta los cristales del más cálido al más frío.\"","Grabado en la piedra: \"Despierta los cristales del más frío al más cálido.\"","Grabado en la piedra: \"Despierta los cristales en este orden: la hoja, el mar, el fuego, el sol.\"","Grabado en la piedra: \"Despierta los cristales en este orden: el mar, el sol, la hoja, el fuego.\"","El Vestíbulo de Entrada","La Sala de las Estatuas","La Galería de las Palancas","El Suelo de Baldosas","La Sala de las Jarras","Grabado en la piedra: \"Cuenta desde la pared izquierda. La llave de bronce duerme en la "," jarra.\"","La Cámara Dorada","La Bodega de los Escombros","Grabado en la piedra: \"Las cosas pesadas se empujan, nunca se tiran.\"","La Sala del Bloque","Grabado en la piedra: \"La placa de piedra quiere algo pesado.\"","El Pasillo de Fuego","La Escalera del Sol","La Sala de los Cristales","La Sala de Hielo","El suelo es de hielo macizo. Resbalas hasta que algo te detiene.","La Puerta de los Números","Grabado en la piedra: \"El código: ","La Sala de la Canción","El Trono del Sol","Grabado en la piedra: \"Gira cada estatua hacia el norte. Pero cuidado: cada estatua arrastra a su vecina.\"","Grabado en la piedra: \"Gira cada estatua hacia el este. Pero cuidado: cada estatua arrastra a su vecina.\"","Grabado en la piedra: \"Gira cada estatua hacia el sur. Pero cuidado: cada estatua arrastra a su vecina.\"","Grabado en la piedra: \"Gira cada estatua hacia el oeste. Pero cuidado: cada estatua arrastra a su vecina.\"","Grabado en la piedra: \"El número se esconde tras el libro justo a la derecha del libro rojo.\"","Grabado en la piedra: \"El número se esconde tras el libro justo a la derecha del libro azul.\"","Grabado en la piedra: \"El número se esconde tras el libro justo a la derecha del libro verde.\"","Grabado en la piedra: \"El número se esconde tras el libro justo a la derecha del libro morado.\"","Grabado en la piedra: \"El número se esconde tras el libro justo a la derecha del libro amarillo.\"","Grabado en la piedra: \"El número se esconde tras el libro justo a la derecha del libro naranja.\"","Grabado en la piedra: \"El número se esconde tras el libro justo a la derecha del libro blanco.\"","¡Retumba! Unas rocas ruedan por esta sala. Mira las flechas de las paredes.","En esta sala salen y se esconden baldosas con pinchos. Calcula bien tus pasos.","¡Cuidado! Hay hoyos en el suelo.","Grabado en la piedra: \"Enciende cada linterna antes de que se apague la primera.\"","Grabado en la piedra: \"Toca las campanas en este orden, contando desde la izquierda: ","Grabado en la piedra: \"La gema duerme entre la "," pila y la "," pila.\"","Grabado en la piedra: \"Pon el dial en el número de estrellas doradas de la pared.\"","Grabado en la piedra: \"Pisa las placas de colores en el orden que muestra la pared.\"","La Celda Adormilada","Grabado en la piedra: \"Bienvenido de nuevo, explorador. La enorme cámara acorazada es la salida.\"","La Sala de la Cámara Acorazada","Grabado en la piedra: \"Diez salas rodean la cámara acorazada. Cada una guarda un número secreto. Llévalos todos a la cámara.\"","La Sala de las Linternas","La Sala del Eco","El Jardín de las Estatuas","La Sala de la Noche","La Sala de la Arena","La Sala de los Números","La Sala de los Colores","La Sala Oscura","Aquí está muy oscuro. Algo brilla suavemente, en algún lugar.","La Sala del Resbalón","La Biblioteca Oculta","Grandes olas suben por la playa. Mira las flechas de espuma en los bordes.","En esta sala los erizos de mar salen y se esconden. Elige bien el momento.","¡Cuidado! En la arena hay pozas profundas escondidas.","¡Cuidado! Hay arenas movedizas escondidas en la arena.","¡Un túnel secreto! Cuidado con dónde pisas en la oscuridad.","¡El tesoro de los piratas! El oro brilla por todas partes.","El sendero se retuerce como una serpiente. Encuentra el camino hacia el norte en la oscuridad.","El río es profundo. Salta por las piedras para cruzarlo. Algunas piedras se hunden un momento, así que míralas bien.","¡Cuidado! En este pantano hay hoyos de barro.","¡Rumble! En esta sala ruedan troncos. Mira las flechas de los bordes.","Bidón de gasolina","¡Has encontrado un bidón de gasolina para el avión!","¡Has encontrado una hélice! Está un poco embarrada, pero gira.","Llave del piloto","¡Has encontrado la llave del piloto!","¡Has encontrado un par de remos!","¡Has encontrado una gran vela blanca!","¡Has encontrado una brújula de latón!","¡Has encontrado un timón para el barco!","Escrito en un poste cubierto de musgo: \"Al oeste está el río. Al este está el pantano. Al sur está el árbol viejo. Algo se esconde en el norte.\"","Un cartel oxidado dice: \"Pista de aterrizaje. Este avión necesita tres cosas: gasolina, una hélice y una llave.\"","El claro de la selva","La orilla del río","El pantano de las ranas","El árbol viejo","La vieja pista","El sendero enredado","La cueva de la cascada","Las ruinas de los monos","El jardín hundido","Un cartel roto dice: \"Al oeste está el arrecife. Al este está la cala pirata. Al sur está el faro. Al norte está lo que los viejos pescadores escondieron.\"","Un cartel descolorido dice: \"Muelle viejo. Un bote necesita remos y una vela.\"","La playa del choque","El arrecife de coral","La cala de los piratas","El faro","El laberinto de manglares","El muelle viejo","El Banco de Arena","El Naufragio","El Túnel Secreto","El Tesoro de los Piratas","Diario del explorador","Escape del Templo","Estabas persiguiendo una mariposa dorada cuando el suelo de la selva cedió. Caes a través del techo de un antiguo templo de piedra y aterrizas en el suelo polvoriento del Vestíbulo de Entrada.","El agujero de arriba está demasiado alto para trepar. La única salida atraviesa el templo, entre acertijos, palancas y suelos traicioneros, y sube las escaleras hacia el sol.","Muévete con las flechas, WASD, los botones o tocando el mapa. Camina hacia las cosas para usarlas. Aquí nada puede hacerte daño. Si resbalas, solo pierdes un poco de tiempo.","Explorador: <b id=\"pn\"> <\/b>","Empieza a explorar","Ir directo a la segunda parte","Ir directo a la Parte Tres","Ir directo a la Parte Cuatro","Tienda","¿No eres tú?","¿Quién eres?","Escribe tu nombre. Tus puntos y tu ropa se guardan con tu nombre.","O elige un explorador:","Soy yo","Cancelar","El guardián habla","La estatua habla","Aléjate","Entonces, ¡ZAS! Algo pequeño te pica en el cuello. ¡Un dardo tranquilizante! Te tiemblan las piernas, la luz del sol se desenfoca y todo se vuelve suave y adormilado. No te preocupes, es solo un dardo para dormir.","Empieza la segunda parte","Mientras duermes, una enorme cámara acorazada te espera en otra parte del templo, cerrada con diez códigos secretos.","Has ganado <b>","<\/b> puntos!","Pasos<b>","Despierta en la segunda parte","Jugar otra vez","Ir a la tienda","Leyenda del templo","Campeón del Sol","Explorador del cielo","¡Has escapado!","Subes los escalones gastados con el ídolo de oro en un brazo y la Corona del Sol en la cabeza. La luz del sol te inunda, todo el templo emite un largo y feliz estruendo, y la mariposa dorada te guía hacia casa.","Te pones la Corona del Sol en la cabeza y subes las últimas escaleras hacia el aire libre. Toda la selva brilla bajo tus pies, y la mariposa dorada baila alrededor de la corona.","Dejas la Corona del Sol en su trono y subes las últimas escaleras hacia el aire libre. La selva brilla bajo tus pies, y la mariposa dorada se posa en tu hombro.","Cazador de tesoros","Explorador sabio","Subes los escalones gastados con el ídolo de oro bajo el brazo y empujas una trampilla de piedra. La luz del sol te inunda. Los pájaros cantan. Muy abajo, el templo emite un largo estruendo aliviado y se queda en silencio.","Dejas el ídolo de oro en su pedestal, porque algunos tesoros pertenecen donde están. Las escaleras terminan en una trampilla de piedra. La empujas y la luz del sol te inunda. Los pájaros cantan, y la mariposa dorada te está esperando.","Secreto: este templo tiene más de lo que has visto. ¿Puedes encontrar el piso de abajo?","Viste a tu explorador","Tus puntos: <b>","Supera el juego para ganar más puntos."," pts","Listo","El soporte de la antorcha está vacío ahora.","Sacas una antorcha del soporte de la pared. Se aviva con una cálida luz naranja.","Una vasija de barro agrietada. Dentro hay una nota enrollada: \"Enciende una antorcha antes de ir más adentro. Las salas oscuras esconden el camino.\"","La estatua sonríe. Sus ojos brillan en verde.","Un mural desvaído muestra cuatro signos en fila. Debajo dice: \"Despiértalos en este orden.\"","Esta jarra ya está vacía.","La piedra de la mariposa ya está pulsada.","En la piedra hay grabada una mariposa dorada. La pulsas. ¡Clic! Una escalera oculta se despliega hacia arriba, hacia la luz de las estrellas.","¡Clic! Los tres diales encajan en su sitio y la puerta del norte se abre.","La esfera ahora está en silencio.","La esfera se ilumina y toca una canción de luces. Mira bien y luego repítela en las placas.","El trono ahora está vacío.","Levantas la Corona del Sol. Está cálida y brilla suavemente. Las escaleras hacia el aire libre te esperan.","Cinco lámparas están pintadas en la pared. Pisar una piedra la cambia a ella y a sus dos vecinas. Iguala el dibujo.","Ya has cavado aquí.","¡Bajo la arena encuentras una piedra luminosa!","¡La arena cede! Resbalas hasta la puerta.","Se abre un panel secreto en la pared del faro. ¡Dentro hay una brújula de latón!","La placa vibra suavemente.","¡Bzzt! Esa no es. No pasa nada, empieza de nuevo desde el primer color.","Solo polvo y páginas viejas.","¡Detrás del libro hay una piedra luminosa!","En la corteza hay cinco hongos pintados. Al tocar un hongo, cambia él y sus dos vecinos. Copia el dibujo.","La llave del piloto vibra y brilla. ¡Las lianas se apartan y un sendero lleva al norte!","Unas lianas espesas bloquean el camino al norte. No se mueven.","Subes y giras la llave. ¡El motor tose y luego ruge!","El tanque está vacío. Busca un bidón de gasolina.","La nariz no tiene hélice. Quizá alguien la perdió en el pantano.","En la cabina hace falta una llave. Un árbol hueco podría guardar una a salvo.","Una puerta oculta se desliza en la pared. ¡Dentro hay una hélice!","Una compuerta secreta se abre. ¡Dentro hay una gran vela blanca!","La piedra de la calavera ya está pulsada.","Hay una calavera tallada en esta roca. La pulsas. ¡Clic! Se abre una escalera secreta en el suelo.","El viejo avión es un naufragio humeante. Nunca volverá a volar. ¡Necesitas un bote!","La brújula gira y apunta al norte. ¡Las gruesas raíces se apartan!","Un enredo de raíces de manglar bloquea el camino al norte. No se mueven.","Ahora el cofre está vacío.","Abres el enorme cofre del tesoro. ¡Está lleno de monedas de oro! Has ganado 50 puntos extra.","Abres el viejo cofre. ¡Dentro hay un mango dorado brillante! Has ganado 20 puntos extra.","Empujas el bote fuera del muelle. ¡La vela se llena de viento!","El bote no tiene remos. Busca cerca del arrecife.","El mástil no tiene vela. Quizá los piratas escondieron una.","El barco no tiene timón. Quizás esté en el viejo naufragio.","La linterna ya está encendida.","Necesitas una llama para encenderla.","La última linterna se enciende de golpe.","La linterna brilla cálida.","La campana suena suavemente.","La última campana resuena.","¡Clang! Las campanas callan. No pasa nada, empieza de nuevo.","Un montón de piedras caídas bloquea el paso.","Un pesado pilar de piedra.","Un muro de piedra tallada. Solo el guardián puede abrirlo.","La placa ya está pulsada. La puerta está abierta.","Pulsas el botón de piedra. El pesado bloque se desliza de vuelta a donde empezó.","El pedestal está vacío.","Levantas el ídolo de oro. ¡Todo el templo tiembla y el suelo empieza a agrietarse!","El cristal brilla con luz firme.","El cuarto cristal se ilumina. La puerta de piedra se desliza con un profundo zumbido.","¡Ping! El cristal se ilumina.","¡Bzzt! Todos los cristales se apagan. Inténtalo de nuevo, la placa tiene la pista.","Las placas vibran suavemente. La puerta está abierta.","Toca primero la esfera luminosa.","Primero mira, luego repítela.","¡Din-din-din! La canción está completa y la puerta del norte se desliza abierta.","Nota equivocada. La esfera volverá a tocar la canción.","La piedra no se mueve en esa dirección.","¡Clic! La placa de piedra se hunde y la puerta del norte se abre rechinando.","La palanca ya está bajada.","La cuarta palanca baja con un golpe. En algún lugar de la pared una cadena traquetea y la puerta del norte se abre rechinando.","Clunk. La palanca "," se queda abajo.","Clic-clic-clic. Todas las palancas vuelven a subir de golpe. Inténtalo de nuevo, el mural tiene el orden.","Más allá de la puerta hay oscuridad total. Primero necesitas una luz.","La puerta está sellada. Cuatro estatuas la vigilan. Responde a todos sus acertijos.","La puerta de piedra no se mueve. Debe haber una forma de despertarla.","La puerta está cerrada con llave. Necesitas una llave.","La puerta tiene tres diales numéricos. Está bien cerrada.","La puerta está cerrada. Las placas luminosas deben tocar la canción correcta.","La puerta está bien cerrada. Algo pesado debe descansar sobre la placa de piedra.","Despiertas sobre la piedra fría en otra parte del templo. Tienes la cabeza algo confusa, pero estás bien.","¡En la pared aparece un número luminoso!","El hielo se derrite y queda piedra normal.","La enorme cámara acorazada","Pon cada dial en el número de su sala. Si ya has visto un número, está escrito aquí para ti.","Has visto el número ","Segunda parte","¡La cámara acorazada se abre!","Cada dial encaja en su sitio. ¡CLUNK! La enorme puerta de la cámara se abre de par en par y la luz del sol entra a raudales. ¡Has escapado de la segunda parte!","A la selva: Parte Tres","Jugar otra vez la segunda parte","Sales de la bóveda a una selva cálida y espesa. En algún lugar hay un avión que puede llevarte a casa.","Un avión necesita gasolina, una hélice y una llave. ¡Mira a tu alrededor!","¡Clic! Dentro del árbol se abre un hueco y dentro brilla una llave!","Parte tres","¡El avión despega!","El motor ruge y el viejo avión sube alto sobre la selva verde. Pero entonces tose y se atasca. ¡Humo! Planeas hacia abajo y aterrizas de golpe en una playa de arena. No te has hecho daño, pero el avión ya no vuela más.","Continuar con la Parte Cuatro","Jugar otra vez la Parte Tres","¡CRASH! Sales rodando del avión roto a una playa de arena. No te has hecho daño, pero el avión nunca volverá a volar.","Quizá puedas encontrar un bote para escapar de esta isla. ¡Mira a tu alrededor!","Parte cuatro","¡Te alejas navegando!","Empujas el barco hacia el mar azul. El viento llena la vela y la isla se hace cada vez más pequeña. Pero ¿qué es esa nube oscura en el horizonte? Continuará...","Jugar otra vez la Parte Cuatro","¡Splash! Te caes al río y vuelves nadando a la orilla. No pasa nada.","¡Ay! La arena te traga los pies. Te sueltas y sales por la puerta. No pasa nada.","¡Splash! Caes en una poza profunda y sales junto a la puerta. No pasa nada.","¡Splop! Te hundes en el barro y sales junto a la puerta. No pasa nada.","Resbalas a un hoyo y sales por la puerta. No pasa nada.","¡Splash! La piedra se hundió. Vuelves nadando a la orilla. No pasa nada.","Bajas por la escalera secreta a un túnel oscuro.","Subes la escalera secreta. El aire fresco de la noche y la luz de las estrellas te reciben.","¡Clic! La baldosa se hunde y resbalas hasta el inicio de la sala.","Caes rodando a una bodega bajo el templo. Los escombros son blandos, así que no te haces daño. Tu antorcha sigue ardiendo.","¡Uf! ¡Qué calor! Saltas de vuelta al inicio de la sala.","¡Bonk! Un barril te empuja de vuelta a la puerta. No pasa nada.","¡Splash! Una gran ola te empuja hacia la puerta. No pasa nada.","¡Whump! Un tronco te empuja hacia la puerta. No pasa nada.","¡Zas! Una roca te empuja hasta la puerta. No pasa nada.","¡Ay! Un erizo de mar te pincha. Vuelves saltando a la puerta.","¡Ay! Los pinchos te pinchan. Saltas de vuelta a la puerta.","Las linternas se apagan. No pasa nada, vuelve a encenderlas, ¡pero más rápido!","Antorcha","Llave de bronce","Ídolo de oro","Corona del Sol","Códigos "," de 10","Acertijos "," de 4"," de 2","Con las manos vacías.","Te sacudes el polvo. Encuentra una luz, y luego encuentra la salida.","¡Comprado! Te queda genial.","Aún no tienes suficientes puntos. ¡Supera el juego para ganar más!","¡Correcto! Los ojos de la estatua brillan en verde.","Un profundo clic resuena desde la puerta del norte. Está abierta.","¡Correcto! El guardián asiente. \"Una pregunta más.\"","¡Correcto! El guardián se inclina y el muro de piedra se hunde en el suelo. El camino a las escaleras está abierto.","Los ojos de la estatua parpadean. No es eso. Inténtalo de nuevo, no hay prisa.","El guardián espera con paciencia. Inténtalo de nuevo, no hay prisa.","Nada","Mochila","Sombreros","Chaquetas","Espalda","Pasos","Monedas","Agua","Tiempo","Lluvia","Oscuridad","Luz del sol","Hélice","Remos","Vela","Brújula","Timón","Puesto","Ponerse","Sol","Luna","Estrella","Ola","Sonido","Idioma","Mapa del juego","Ir al norte","Ir al oeste","Ir al sur","Ir al este","Acertijo","Piel","primera","segunda","tercera","cuarta","quinta","sexta","¡Din!","Resbalones<b>"]};</script>

var D=window.__I18N_DATA,IDX={},cache=new Map(),ALN=/[A-Za-z0-9À-ɏ]/;

var TAG=/<\/?[A-Za-z][^>]*/y;
function tr(s){
  if(LANG==='en'||typeof s!=='string'||s.length<2)return s;
  var c=cache.get(s);if(c!==undefined)return c;
  var out='',i=0,n=s.length;

    if(ch==='<'){TAG.lastIndex=i;var m=TAG.exec(s);if(m){out+=m[0];i+=m[0].length;continue}}

  }
