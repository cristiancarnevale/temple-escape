<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#08191f">
<title>Temple Escape</title>
<style>
:root{--bg:#08191f;--panel:#0f2c36;--panel-2:#153947;--line:#2a5866;--fg:#e8efe9;--muted:#8db0b4;--accent:#f2b84b;--accent-ink:#2a1c03;--good:#6fcf8c;--bad:#ef6f62;
  --font-body:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
/* The whole game fits the screen: header, then a stage that takes the rest of the height. */
.app{max-width:1080px;margin:0 auto;height:calc(100vh - 20px);height:calc(100dvh - 20px);display:flex;flex-direction:column;gap:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{margin:0;font-size:26px;line-height:1}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.viewport{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;background:#0b3d50;overflow:hidden}
canvas{display:block;width:100%;height:100%;object-fit:contain}
.log{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:13px;height:84px;overflow:hidden;flex:none}.log div{color:var(--muted)}.log div:first-child{color:var(--fg)}
.controls{display:flex;gap:16px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px}
.dpad button:nth-child(1){grid-column:2;grid-row:1}.dpad button:nth-child(2){grid-column:1;grid-row:2}.dpad button:nth-child(3){grid-column:2;grid-row:2}.dpad button:nth-child(4){grid-column:3;grid-row:2}
button{font:600 14px/1.1 var(--font-body);color:var(--fg);background:var(--panel-2);border:1px solid var(--line);border-radius:4px;min-height:44px;padding:8px 12px;cursor:pointer;touch-action:manipulation}
button:hover:not(:disabled){border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(4,12,16,.88);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto}
.card{max-width:480px;width:100%;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:30px;line-height:1.05}.card p{margin:0}
.kicker{font:500 11px ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.langs{display:flex;gap:6px;flex-wrap:wrap}.langs button{min-height:32px;padding:4px 12px;font-size:13px}.langs button.on{border-color:var(--accent);color:var(--accent)}
.muted{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:26px;align-items:center}.chip{background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:3px 8px;font-size:12.5px;color:var(--accent)}
.hbtns{display:flex;gap:6px}
.card.wide{max-width:640px}
.shophead{display:flex;gap:16px;align-items:center}.shophead p+p{margin-top:4px}
#prev{width:120px;height:120px;flex:none;background:var(--panel-2);border:1px solid var(--line);border-radius:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{min-height:36px;padding:6px 14px}.tabs button.on{border-color:var(--accent);color:var(--accent)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.items button{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;text-align:left}.items button.on{border-color:var(--good)}.items small{color:var(--muted);font-weight:500;font-size:12px}.items button.on small{color:var(--good)}
.dot{width:16px;height:16px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,.35)}
.coming{font:700 22px var(--font-body);color:var(--accent);text-align:center;padding:10px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.earn{font-size:17px}.earn b{color:var(--accent);font:600 20px ui-monospace,Menlo,monospace}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stats div{background:var(--panel-2);border-radius:4px;padding:8px 10px;font-size:12px;color:var(--muted)}.stats b{display:block;font:500 18px ui-monospace,Menlo,monospace;color:var(--fg)}
.vrow{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}.vrow>span:first-child{flex:1 1 140px;font-weight:600}.vrow button{min-width:56px;min-height:44px;font-size:22px}
</style>
</head>

</div>

","Clic-clic-clic. Tutte le leve tornano su di scatto. Riprova, il mosaico ha l'ordine.","Oltre la porta è buio pesto. Prima ti serve una luce.","La porta è sigillata. Quattro statue la sorvegliano. Rispondi a tutti i loro indovinelli.","La porta di pietra non si muove. Deve esserci un modo per svegliarla.","La porta è chiusa a chiave. Ti serve una chiave.","La porta ha tre quadranti numerici. È chiusa ermeticamente.","La porta è chiusa. Le piastre luminose devono suonare la canzone giusta.","La porta è serrata. Qualcosa di pesante deve stare sulla piastra di pietra.","Ti svegli sulla pietra fredda in un'altra parte del tempio. La testa è un po' confusa, ma stai bene.","L'enorme caveau","Imposta ogni quadrante sul numero della sua sala. Se hai già visto un numero, è scritto qui per te.","Hai visto il numero ","Seconda parte","Il caveau si apre!","Ogni quadrante scatta al suo posto. CLUNK! L'enorme porta del caveau si spalanca e la luce del sole entra a fiotti. Sei scappato dalla seconda parte!","Sali la scala segreta. L'aria fresca della notte e la luce delle stelle ti accolgono.","Clic! La piastrella affonda e scivoli all'inizio della sala.","Ruzzoli giù in una cantina sotto il tempio. Le macerie sono morbide, quindi non ti fai male. La torcia brucia ancora.","Whoosh! Che caldo! Salti indietro all'inizio della sala.","Torcia","Chiave di bronzo","Idolo d'oro","Corona del Sole","Codici "," su 10","Indovinelli "," su 4"," su 2","A mani vuote.","Ti scrolli la polvere di dosso. Trova una luce, poi trova la via d'uscita.","Acquistato! Stai benissimo.","Non hai ancora abbastanza punti. Batti il gioco per guadagnarne altri!","Esatto! Gli occhi della statua brillano di verde.","Un profondo clic risuona dalla porta a nord. È aperta.","Corretto! Il guardiano annuisce. \"Ancora una domanda.\"","Corretto! Il guardiano si inchina e il muro di pietra affonda nel pavimento. La via verso le scale è aperta.","Gli occhi della statua tremolano. Non è questa. Riprova, non c'è fretta.","Il guardiano aspetta con pazienza. Riprova, non c'è fretta.","Niente","Zaino","Cappelli","Giacche","Schiena","Passi","Monete","Acqua","Tempo","Pioggia","Il buio","La luce del sole","Indossato","Indossa","Sole","Luna","Stella","Onda","Suono","Lingua","Mappa del gioco","Vai a nord","Vai a ovest","Vai a sud","Vai a est","Indovinello","Pelle","prima","seconda","terza","quarta","quinta","sesta","Din!","Scivoloni<b>"],"es":["Sombrero de explorador","Gorra roja","Gorro de fiesta","Sombrero de mago","Sombrero pirata","Sombrero de copa","Corona de oro","Sin sombrero","Chaqueta naranja","Chaqueta azul","Chaqueta verde","Chaqueta roja","Chaqueta morada","Chaqueta de rayas","Chaqueta dorada","Capa roja","Alas de mariposa","Cuantos más me llevas, más dejas atrás. ¿Qué soy?","Soy alta cuando soy joven y baja cuando soy vieja. ¿Qué soy?","Una vela","Un árbol","Una montaña","Un río","Repito cada palabra que dices, pero no tengo boca. ¿Qué soy?","Un loro","Un espejo","Un eco","Una sombra","¿Qué se moja más cuanto más seca?","Una toalla","Un pez","Un lago","Cuanto más hay de mí, menos ves. ¿Qué soy?","Un arcoíris","Tengo manos pero no puedo aplaudir. ¿Qué soy?","Una estatua","Un reloj","Un bote","¿Qué sube cuando la lluvia baja?","Un pájaro","Una nube","Un paraguas","Una cometa","Tengo ciudades pero no casas, montañas pero no árboles y agua pero no peces. ¿Qué soy?","Un sueño","Un libro","Un mapa","¿Qué hay que romper antes de poder usarlo?","Una llave","Un puente","Un huevo","Una canción","¿Qué puede viajar por todo el mundo quedándose en una esquina?","Un sello","Un avión","Un barco","¿Qué tiene muchas teclas pero no puede abrir ni una sola puerta?","Un piano","Un castillo","Un anillo","Un candado","Vacía, salvo por una araña muy sorprendida.","Solo polvo y unas cuantas piedrecitas viejas.","¡Una sola moneda de oro! Qué pena que sea de chocolate y viejísima.","Dentro hay una ranita. Salta fuera y se aleja. ¡Croac!","Solo un pedazo de cuerda vieja.","¡Bajo una capa de arena encuentras una pequeña llave de bronce!","las narices en tu cara","las ruedas de una bicicleta","los lados de un triángulo","las patas de un perro","los dedos de una mano","las patas de un insecto","los días de una semana","las patas de una araña","las vidas de un gato","Grabado en la piedra: \"Despierta los cristales del más cálido al más frío.\"","Grabado en la piedra: \"Despierta los cristales del más frío al más cálido.\"","Grabado en la piedra: \"Despierta los cristales en este orden: la hoja, el mar, el fuego, el sol.\"","Grabado en la piedra: \"Despierta los cristales en este orden: el mar, el sol, la hoja, el fuego.\"","El Vestíbulo de Entrada","La Sala de las Estatuas","La Galería de las Palancas","El Suelo de Baldosas","La Sala de las Jarras","Grabado en la piedra: \"Cuenta desde la pared izquierda. La llave de bronce duerme en la "," jarra.\"","La Cámara Dorada","La Bodega de los Escombros","Grabado en la piedra: \"Las cosas pesadas se empujan, nunca se tiran.\"","La Sala del Bloque","Grabado en la piedra: \"La placa de piedra quiere algo pesado.\"","El Pasillo de Fuego","La Escalera del Sol","La Sala de los Cristales","La Sala de Hielo","El suelo es de hielo macizo. Resbalas hasta que algo te detiene.","La Puerta de los Números","Grabado en la piedra: \"El código: ","La Sala de la Canción","El Trono del Sol","La Celda Adormilada","Grabado en la piedra: \"Bienvenido de nuevo, explorador. La enorme cámara acorazada es la salida.\"","La Sala de la Cámara Acorazada","Grabado en la piedra: \"Cada sala alrededor de la cámara acorazada guarda un número secreto. Llévalos todos a la cámara.\"","La Sala de las Linternas","La Sala del Eco","Grabado en la piedra: \"Toca las campanas de la más grande a la más pequeña.\"","Grabado en la piedra: \"Toca las campanas de la más pequeña a la más grande.\"","Diario del explorador","Escape del Templo","Estabas persiguiendo una mariposa dorada cuando el suelo de la selva cedió. Caes a través del techo de un antiguo templo de piedra y aterrizas en el suelo polvoriento del Vestíbulo de Entrada.","El agujero de arriba está demasiado alto para trepar. La única salida atraviesa el templo, entre acertijos, palancas y suelos traicioneros, y sube las escaleras hacia el sol.","Muévete con las flechas, WASD, los botones o tocando el mapa. Camina hacia las cosas para usarlas. Aquí nada puede hacerte daño. Si resbalas, solo pierdes un poco de tiempo.","Empieza a explorar","Tienda","El guardián habla","La estatua habla","Aléjate","Entonces, ¡ZAS! Algo pequeño te pica en el cuello. ¡Un dardo tranquilizante! Te tiemblan las piernas, la luz del sol se desenfoca y todo se vuelve suave y adormilado. No te preocupes, es solo un dardo para dormir.","Empieza la segunda parte","Mientras duermes, una enorme cámara acorazada te espera en otra parte del templo, cerrada con diez códigos secretos.","Has ganado <b>","<\/b> puntos!","Pasos<b>","Despierta en la segunda parte","Jugar otra vez","Ir a la tienda","Leyenda del templo","Campeón del Sol","Explorador del cielo","¡Has escapado!","Subes los escalones gastados con el ídolo de oro en un brazo y la Corona del Sol en la cabeza. La luz del sol te inunda, todo el templo emite un largo y feliz estruendo, y la mariposa dorada te guía hacia casa.","Te pones la Corona del Sol en la cabeza y subes las últimas escaleras hacia el aire libre. Toda la selva brilla bajo tus pies, y la mariposa dorada baila alrededor de la corona.","Dejas la Corona del Sol en su trono y subes las últimas escaleras hacia el aire libre. La selva brilla bajo tus pies, y la mariposa dorada se posa en tu hombro.","Cazador de tesoros","Explorador sabio","Subes los escalones gastados con el ídolo de oro bajo el brazo y empujas una trampilla de piedra. La luz del sol te inunda. Los pájaros cantan. Muy abajo, el templo emite un largo estruendo aliviado y se queda en silencio.","Dejas el ídolo de oro en su pedestal, porque algunos tesoros pertenecen donde están. Las escaleras terminan en una trampilla de piedra. La empujas y la luz del sol te inunda. Los pájaros cantan, y la mariposa dorada te está esperando.","Secreto: este templo tiene más de lo que has visto. ¿Puedes encontrar el piso de abajo?","Viste a tu explorador","Tus puntos: <b>","Supera el juego para ganar más puntos."," pts","Listo","El soporte de la antorcha está vacío ahora.","Sacas una antorcha del soporte de la pared. Se aviva con una cálida luz naranja.","Una vasija de barro agrietada. Dentro hay una nota enrollada: \"Enciende una antorcha antes de ir más adentro. Las salas oscuras esconden el camino.\"","La estatua sonríe. Sus ojos brillan en verde.","Un mural desvaído muestra cuatro signos en fila. Debajo dice: \"Despiértalos en este orden.\"","Esta jarra ya está vacía.","La piedra de la mariposa ya está pulsada.","En la piedra hay grabada una mariposa dorada. La pulsas. ¡Clic! Una escalera oculta se despliega hacia arriba, hacia la luz de las estrellas.","¡Clic! Los tres diales encajan en su sitio y la puerta del norte se abre.","La esfera ahora está en silencio.","La esfera se ilumina y toca una canción de luces. Mira bien y luego repítela en las placas.","El trono ahora está vacío.","Levantas la Corona del Sol. Está cálida y brilla suavemente. Las escaleras hacia el aire libre te esperan.","La linterna ya está encendida.","Necesitas una llama para encenderla.","¡La tercera linterna se enciende de golpe! En la pared aparece un número luminoso.","La linterna brilla cálida.","La campana suena suavemente.","La última campana resuena. ¡En la pared aparece un número luminoso!","¡Clang! Las campanas callan. No pasa nada, empieza de nuevo.","Un montón de piedras caídas bloquea el paso.","Un pesado pilar de piedra.","Un muro de piedra tallada. Solo el guardián puede abrirlo.","La placa ya está pulsada. La puerta está abierta.","Pulsas el botón de piedra. El pesado bloque se desliza de vuelta a donde empezó.","El pedestal está vacío.","Levantas el ídolo de oro. ¡Todo el templo tiembla y el suelo empieza a agrietarse!","El cristal brilla con luz firme.","El cuarto cristal se ilumina. La puerta de piedra se desliza con un profundo zumbido.","¡Ping! El cristal se ilumina.","¡Bzzt! Todos los cristales se apagan. Inténtalo de nuevo, la placa tiene la pista.","Las placas vibran suavemente. La puerta está abierta.","Toca primero la esfera luminosa.","Primero mira, luego repítela.","¡Din-din-din! La canción está completa y la puerta del norte se desliza abierta.","Nota equivocada. La esfera volverá a tocar la canción.","La piedra no se mueve en esa dirección.","¡Clic! La placa de piedra se hunde y la puerta del norte se abre rechinando.","La palanca ya está bajada.","La cuarta palanca baja con un golpe. En algún lugar de la pared una cadena traquetea y la puerta del norte se abre rechinando.","Clunk. La palanca "," se queda abajo.","Clic-clic-clic. Todas las palancas vuelven a subir de golpe. Inténtalo de nuevo, el mural tiene el orden.","Más allá de la puerta hay oscuridad total. Primero necesitas una luz.","La puerta está sellada. Cuatro estatuas la vigilan. Responde a todos sus acertijos.","La puerta de piedra no se mueve. Debe haber una forma de despertarla.","La puerta está cerrada con llave. Necesitas una llave.","La puerta tiene tres diales numéricos. Está bien cerrada.","La puerta está cerrada. Las placas luminosas deben tocar la canción correcta.","La puerta está bien cerrada. Algo pesado debe descansar sobre la placa de piedra.","Despiertas sobre la piedra fría en otra parte del templo. Tienes la cabeza algo confusa, pero estás bien.","La enorme cámara acorazada","Pon cada dial en el número de su sala. Si ya has visto un número, está escrito aquí para ti.","Has visto el número ","Segunda parte","¡La cámara acorazada se abre!","Cada dial encaja en su sitio. ¡CLUNK! La enorme puerta de la cámara se abre de par en par y la luz del sol entra a raudales. ¡Has escapado de la segunda parte!","Subes la escalera secreta. El aire fresco de la noche y la luz de las estrellas te reciben.","¡Clic! La baldosa se hunde y resbalas hasta el inicio de la sala.","Caes rodando a una bodega bajo el templo. Los escombros son blandos, así que no te haces daño. Tu antorcha sigue ardiendo.","¡Uf! ¡Qué calor! Saltas de vuelta al inicio de la sala.","Antorcha","Llave de bronce","Ídolo de oro","Corona del Sol","Códigos "," de 10","Acertijos "," de 4"," de 2","Con las manos vacías.","Te sacudes el polvo. Encuentra una luz, y luego encuentra la salida.","¡Comprado! Te queda genial.","Aún no tienes suficientes puntos. ¡Supera el juego para ganar más!","¡Correcto! Los ojos de la estatua brillan en verde.","Un profundo clic resuena desde la puerta del norte. Está abierta.","¡Correcto! El guardián asiente. \"Una pregunta más.\"","¡Correcto! El guardián se inclina y el muro de piedra se hunde en el suelo. El camino a las escaleras está abierto.","Los ojos de la estatua parpadean. No es eso. Inténtalo de nuevo, no hay prisa.","El guardián espera con paciencia. Inténtalo de nuevo, no hay prisa.","Nada","Mochila","Sombreros","Chaquetas","Espalda","Pasos","Monedas","Agua","Tiempo","Lluvia","Oscuridad","Luz del sol","Puesto","Ponerse","Sol","Luna","Estrella","Ola","Sonido","Idioma","Mapa del juego","Ir al norte","Ir al oeste","Ir al sur","Ir al este","Acertijo","Piel","primera","segunda","tercera","cuarta","quinta","sexta","¡Din!","Resbalones<b>"]};</script>

  if(ny===5&&nx===0&&R().to&&R().to.w!=null){sdoor('w');return}

  else if(k===3){c.strokeStyle=col;c.lineWidth=2;for(var j=0;j<2;j++){c.beginPath();for(var i2=-r;i2<=r;i2+=1.5){var yy=y+(j?r*.4:-r*.3)+Math.sin(i2/r*4.5)*r*.28;if(i2===-r)c.moveTo(x+i2,yy);else c.lineTo(x+i2,yy)}c.stroke()}}
